# port: 7890 # HTTP(S) proxy port
# socks-port: 7891 # SOCKS5 proxy port
mixed-port: 10801 # Mixed HTTP(S) and SOCKS proxy port
# redir-port: 7892 # Transparent proxy port for Linux and macOS

# Transparent proxy server port for Linux (TProxy TCP and TProxy UDP)
# tproxy-port: 7893

allow-lan: true # Allow connections from the LAN
bind-address: "*" # Address to bind, only used when allow-lan is true; '*' means all addresses
authentication: # Username and password for the http / socks inbounds
  - "username:password"
skip-auth-prefixes: # IP ranges that skip authentication
  - 127.0.0.1/8
  - ::1/128
lan-allowed-ips: # IP ranges allowed to connect, only when allow-lan is true; default 0.0.0.0/0 and ::/0
  - 0.0.0.0/0
  - ::/0
lan-disallowed-ips: # IP ranges denied to connect; the blacklist has priority over the whitelist; empty by default
  - 192.168.0.3/32

#  find-process-mode has 3 values:always, strict, off
#  - always, on: always match processes
#  - strict, default: mihomo decides whether to match processes
#  - off, do not match processes; recommended on routers
find-process-mode: strict

mode: rule

# Custom geodata URLs
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"

geo-auto-update: false # Update geodata automatically
geo-update-interval: 24 # Update interval, in hours

# Matcher implementation used by GeoSite, available implementations:
# - succinct (default, same as rule-set)
# - mph (from V2Ray, also `hybrid` in Xray)
# geosite-matcher: succinct

log-level: debug # Log level: silent / error / warning / info / debug

ipv6: true # Global IPv6 switch; when off, all IPv6 connections are blocked and DNS AAAA answers are dropped

tls:
  certificate: string # Certificate in PEM format, or the path to it
  private-key: string # Private key of the certificate in PEM format, or the path to it
  custom-certifactes:
    - |
      -----BEGIN CERTIFICATE-----
      format/pem...
      -----END CERTIFICATE-----

external-controller: 0.0.0.0:9093 # RESTful API listen address
external-controller-tls: 0.0.0.0:9443 # RESTful API HTTPS listen address; needs the tls section
# secret: "123456" # `Authorization:Bearer ${secret}`

# RESTful API CORS headers
external-controller-cors:
  allow-origins:
    - *
  allow-private-network: true

# RESTful API Unix socket listen address (also works on Windows 10 1803 / build 17063 and newer)
# !!! Note: API calls through the Unix socket do not check the secret; secure it yourself if you enable it !!!
# Test with: curl -v --unix-socket "mihomo.sock" http://localhost/
external-controller-unix: mihomo.sock

# RESTful API Windows named pipe listen address
# !!! Note: API calls through the named pipe do not check the secret; secure it yourself if you enable it !!!
external-controller-pipe: \\.\pipe\mihomo

# tcp-concurrent: true # Connect to all resolved IPs at once and use the fastest TCP handshake

# Web UI folder, opened at http://{{external-controller}}/ui
external-ui: /path/to/ui/folder/
external-ui-name: xd
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

# DoH server on the RESTful API port
# !!! This URL does not check the secret; secure it yourself if you enable it !!!
external-doh-server: /dns-query

# interface-name: en0 # Outbound network interface

# Global TLS fingerprint; a client-fingerprint set on a proxy takes priority
# Options: "chrome", "firefox", "safari", "ios", "random", "none".
# Utls is currently support TLS transport in TCP/grpc/WS/HTTP for VLESS/Vmess and trojan.
global-client-fingerprint: chrome

#  TCP keep alive interval
# disable-keep-alive: false # Currently forced to true on Android
# keep-alive-idle: 15
# keep-alive-interval: 15

# routing-mark:6666 # fwmark, Linux only
experimental:
  # Disable quic-go GSO support. This may result in reduced performance on Linux.
  # This is not recommended for most users.
  # Only users encountering issues with quic-go's internal implementation should enable this,
  # and they should disable it as soon as the issue is resolved.
  # This field will be removed when quic-go fixes all their issues in GSO.
  # This equivalent to the environment variable QUIC_GO_DISABLE_GSO=1.
  #quic-go-disable-gso: true

# Like /etc/hosts; only a single IP per name
hosts:
# '*.mihomo.dev': 127.0.0.1
# '.dev': 127.0.0.1
# 'alpha.mihomo.dev': '::1'
# test.com: [1.1.1.1, 2.2.2.2]
# home.lan: lan # 'lan' is a special value: the addresses of all local interfaces
# baidu.com: google.com # Only one alias is allowed

profile: # Stored selections
  store-selected: false

  # Persist fake-ip mappings
  store-fake-ip: true

# Tun settings
tun:
  enable: false
  stack: system # gvisor/mixed
  dns-hijack:
    - 0.0.0.0:53 # DNS to hijack
  # auto-detect-interface: true # Detect the outbound interface automatically
  # auto-route: true # Set up routing tables
  # mtu: 9000 # Maximum transmission unit
  # gso: false # Generic segmentation offload, Linux only
  # gso-max-size: 65536 # Maximum packet size for generic segmentation offload
  auto-redirect: false # Set up iptables to redirect TCP connections, Linux only. auto-route with auto-redirect now works on routers as expected without extra steps.
  # strict-route: true # Route all connections into tun to prevent leaks, but the device cannot be reached by other devices
  route-address-set: # Add the destination IP CIDRs of these rule sets to the firewall; unmatched traffic bypasses routing. Linux only, needs nftables with `auto-route` and `auto-redirect` on.
    - ruleset-1
    - ruleset-2
  route-exclude-address-set: # Add the destination IP CIDRs of these rule sets to the firewall; matched traffic bypasses routing. Linux only, needs nftables with `auto-route` and `auto-redirect` on.
    - ruleset-3
    - ruleset-4
  route-address: # Custom routes instead of the default route when auto-route is on
    - 0.0.0.0/1
    - 128.0.0.0/1
    - "::/1"
    - "8000::/1"
  # inet4-route-address: # Custom routes instead of the default route when auto-route is on (old syntax)
  #   - 0.0.0.0/1
  #   - 128.0.0.0/1
  # inet6-route-address: # Custom routes instead of the default route when auto-route is on (old syntax)
  #   - "::/1"
  #   - "8000::/1"
  # endpoint-independent-nat: false # Endpoint-independent NAT
  # include-interface: # Only route these interfaces; no limit by default; conflicts with `exclude-interface`
  #   - "lan0"
  # exclude-interface: # Do not route these interfaces; conflicts with `include-interface`
  #   - "lan1"
  # include-uid: # UID rules are Linux only and need auto-route
  # - 0
  # include-uid-range: # Only route these user ranges
  # - 1000:9999
  # exclude-uid: # Do not route these users
  #- 1000
  # exclude-uid-range: # Do not route these user ranges
  # - 1000:9999

  # Android user and app rules work on Android only
  # and need auto-route

  # include-android-user: # Only route these Android users
  # - 0
  # - 10
  # include-package: # Only route these Android package names
  # - com.android.chrome
  # exclude-package: # Do not route these Android package names
  # - com.android.captiveportallogin

# Domain sniffing, optional
sniffer:
  enable: false
  ## Force sniffing of traffic recognised as redir-host
  ## e.g. Tun, Redir and TProxy with DNS in redir-host mode
  # force-dns-mapping: false
  ## Force sniffing of all traffic that has no domain
  # parse-pure-ip: false
  # Use the sniffed domain as the real destination, default true
  # Global setting; sniffer.sniff settings take priority
  override-destination: false
  sniff: # TLS and QUIC sniff port 443 when no ports are set
    QUIC:
    #  ports: [ 443 ]
    TLS:
    #  ports: [443, 8443]

    # Sniffs port 80 by default
    HTTP: # Ports to sniff
      ports: [80, 8080-8880]
      # Can override sniffer.override-destination
      override-destination: true
  force-domain:
    - +.v2ex.com
  # skip-src-address: # Skip sniffing for these source IPs
  #   - 192.168.0.3/32
  # skip-dst-address: # Skip sniffing for these destination IPs
  #   - 192.168.0.3/32
  ## Skip these sniffing results
  # skip-domain:
  #   - Mijia Cloud
  # Protocols to sniff
  # Deprecated; ignored when sniffer.sniff is set
  sniffing:
    - tls
    - http
  # Always sniff these domains

  # Only sniff ports from the whitelist, default 443, 80
  # Deprecated; ignored when sniffer.sniff is set
  port-whitelist:
    - "80"
    - "443"
    # - 8000-9999

tunnels: # one line config
  - tcp/udp,127.0.0.1:6553,114.114.114.114:53,proxy
  - tcp,127.0.0.1:6666,rds.mysql.com:3306,vpn
  # full yaml config
  - network: [tcp, udp]
    address: 127.0.0.1:7777
    target: target.com
    proxy: proxy

# DNS settings
dns:
  cache-algorithm: arc
  enable: false # When off, the system DNS is used
  prefer-h3: false # Try HTTP/3 for DoH in parallel
  listen: 0.0.0.0:53 # DNS server listen address
  # ipv6: false # false returns empty AAAA answers
  # ipv6-timeout: 300 # In ms: how long to wait for AAAA answers from upstream in dual-stack queries, default 100 ms
  # DNS servers used to resolve the domains of nameserver, fallback and other DNS servers
  # Plain IP addresses only; encrypted DNS is allowed
  default-nameserver:
    - 114.114.114.114
    - 8.8.8.8
    - tls://1.12.12.12:853
    - tls://223.5.5.5:853
    - system # append DNS server from system configuration. If not found, it would print an error log and skip.
  enhanced-mode: fake-ip # or redir-host

  fake-ip-range: 198.18.0.1/16 # fake-ip pool

  # Domains that do not get a fake-ip
  fake-ip-filter:
    - '*.lan'
    - localhost.ptlogin2.qq.com
    # fakeip-filter here is the rule-providers subscription named fakeip-filter,
    # its behavior must be domain/classical; with classical only domain rules apply
    - rule-set:fakeip-filter
    # fakeip-filter here is the geosite category named fakeip-filter (make sure it exists)
    - geosite:fakeip-filter
  # Match mode of fake-ip-filter, default blacklist: a match does not get a fake-ip
  # With whitelist, only matches get a fake-ip
  fake-ip-filter-mode: blacklist

  # use-hosts: true # Look up hosts

  # Whether connections to the nameserver, fallback and nameserver-policy servers follow the rules
  # When false (default), these DNS servers are reached directly unless set otherwise
  # When true, the rules decide how to reach them (proxy or direct); an explicit setting still wins
  # Can only be enabled when proxy-server-nameserver is not empty; strongly not recommended with prefer-h3
  # Domains in these DNS server addresses are resolved with default-nameserver, so set it correctly too
  respect-rules: false

  # Main DNS servers
  # Supports UDP, TCP, DoT, DoH, DoQ
  # This is the main DNS setting and affects all direct connections; use DNS that resolves your region accurately
  nameserver:
    - 114.114.114.114 # default value
    - 8.8.8.8 # default value
    - tls://223.5.5.5:853 # DNS over TLS
    - https://doh.pub/dns-query # DNS over HTTPS
    - https://dns.alidns.com/dns-query#h3=true # Force HTTP/3 for this DoH server, independent of prefer-h3; it will not work if the server lacks HTTP/3
    - https://mozilla.cloudflare-dns.com/dns-query#DNS&h3=true # Use a proxy group and HTTP/3
    - dhcp://en0 # dns from dhcp
    - quic://dns.adguard.com:784 # DNS over QUIC
    # - '8.8.8.8#RULES' # Same as respect-rules, but only for this server
    # - '8.8.8.8#en0' # Also supports setting the DNS outbound interface

  # With fallback set, the IPs returned by nameserver are checked for CN (optional)
  # If they are not CN, the answer from fallback is used
  # Make sure fallback servers can be reached
  # fallback:
  #   - tcp://1.1.1.1
  #   - 'tcp://1.1.1.1#ProxyGroupName' # Resolve through a proxy; ProxyGroupName is a group or proxy name. A proxy has priority over an interface; if the name is not found it is treated as an interface

  # DNS servers only for resolving proxy server domains, optional; if empty, nameserver-policy, nameserver and fallback are used
  # proxy-server-nameserver:
  #   - https://dns.google/dns-query
  #   - tls://one.one.one.one

  # DNS servers only for domains of DIRECT connections, optional; if empty, nameserver-policy, nameserver and fallback are used
  # direct-nameserver:
  #   - system://
  # direct-nameserver-follow-policy: false # Follow nameserver-policy, off by default; only when direct-nameserver is not empty

  # When to use fallback
  # fallback-filter:
  #   geoip: true # Use geoip
  #   geoip-code: CN # When the nameserver answer is a CN IP in geoip, the fallback answer is not used
  #   Force fallback for these; takes priority over the IP check; see the geosite database for categories
  #   geosite:
  #     - gfw
  #   If not matched by ipcidr, the nameservers answer is used
  #   ipcidr:
  #     - 240.0.0.0/4
  #   domain:
  #     - '+.google.com'
  #     - '+.facebook.com'
  #     - '+.youtube.com'

  # DNS servers for specific domains
  nameserver-policy:
    #   'www.baidu.com': '114.114.114.114'
    #   '+.internal.crop.com': '10.0.0.1'
    "geosite:cn,private,apple":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:category-ads-all": rcode://success
    "www.baidu.com,+.google.cn": [223.5.5.5, https://dns.alidns.com/dns-query]
    ## global, dns here are the rule-providers subscriptions named global and dns,
    ## their behavior must be domain/classical; with classical only domain rules apply
    # "rule-set:global,dns": 8.8.8.8

proxies: # socks5
  - name: "socks"
    type: socks5
    server: server
    port: 443
    # username: username
    # password: password
    # tls: true
    # fingerprint: xxxx
    # skip-cert-verify: true
    # udp: true
    # ip-version: ipv6

  # http
  - name: "http"
    type: http
    server: server
    port: 443
    # username: username
    # password: password
    # tls: true # https
    # skip-cert-verify: true
    # sni: custom.com
    # fingerprint: xxxx # sha256 fingerprint like experimental.fingerprints, set per protocol; experimental.fingerprints is then ignored
    # ip-version: dual

  # Snell
  # Beware that there's currently no UDP support yet
  - name: "snell"
    type: snell
    server: server
    port: 44046
    psk: yourpsk
    # version: 2
    # obfs-opts:
    # mode: http # or tls
    # host: bing.com

  # Shadowsocks
  # Supported ciphers:
  #   aes-128-gcm aes-192-gcm aes-256-gcm
  #   aes-128-cfb aes-192-cfb aes-256-cfb
  #   aes-128-ctr aes-192-ctr aes-256-ctr
  #   rc4-md5 chacha20-ietf xchacha20
  #   chacha20-ietf-poly1305 xchacha20-ietf-poly1305
  #   2022-blake3-aes-128-gcm 2022-blake3-aes-256-gcm 2022-blake3-chacha20-poly1305
  - name: "ss1"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    # udp: true
    # udp-over-tcp: false
    # ip-version: ipv4 # IP version for this proxy: dual, ipv4, ipv6, ipv4-prefer, ipv6-prefer. Default dual
    # ipv4: IPv4 only; ipv6: IPv6 only
    # ipv4-prefer: for TCP resolves both stacks and connects in parallel but prefers IPv4,
    # for UDP resolves both stacks and takes the first IPv4 result
    # ipv6-prefer: the same, preferring IPv6
    # All protocols support this option; for TCP it only has effect with tcp-concurrent
    smux:
      enabled: false
      protocol: smux # smux/yamux/h2mux
      # max-connections: 4 # Maximum connections. Conflict with max-streams.
      # min-streams: 4 # Minimum multiplexed streams in a connection before opening a new connection. Conflict with max-streams.
      # max-streams: 0 # Maximum multiplexed streams in a connection before opening a new connection. Conflict with max-connections and min-streams.
      # padding: false # Enable padding. Requires sing-box server version 1.3-beta9 or later.
      # statistic: false # Show the underlying connections in the panel, so they can be closed
      # only-tcp: false # When true, smux settings do not apply to UDP; UDP goes over the underlying protocol

  - name: "ss2"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    plugin: obfs
    plugin-opts:
      mode: tls # or http
      # host: bing.com

  - name: "ss3"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    plugin: v2ray-plugin
    plugin-opts:
      mode: websocket # no QUIC now
      # tls: true # wss
      # Get it with: openssl x509 -noout -fingerprint -sha256 -inform pem -in yourcert.pem
      # A fingerprint enables SSL pinning
      # fingerprint: xxxx
      # skip-cert-verify: true
      # host: bing.com
      # path: "/"
      # mux: true
      # headers:
      #   custom: value
      # v2ray-http-upgrade: false
      # v2ray-http-upgrade-fast-open: false

  - name: "ss4-shadow-tls"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    plugin: shadow-tls
    client-fingerprint: chrome
    plugin-opts:
      host: "cloud.tencent.com"
      password: "shadow_tls_password"
      version: 2 # support 1/2/3

  - name: "ss-restls-tls13"
    type: ss
    server: [YOUR_SERVER_IP]
    port: 443
    cipher: chacha20-ietf-poly1305
    password: [YOUR_SS_PASSWORD]
    client-fingerprint:
      chrome # One of: chrome, ios, firefox or safari
      # One of chrome, ios, firefox, safari
    plugin: restls
    plugin-opts:
      host:
        "www.microsoft.com" # Must be a TLS 1.3 server
        # Must be a TLS 1.3 server
      password: [YOUR_RESTLS_PASSWORD]
      version-hint: "tls13"
      # Control your post-handshake traffic through restls-script
      # Hide proxy behaviors like "tls in tls".
      # see https://github.com/3andne/restls/blob/main/Restls-Script:%20Hide%20Your%20Proxy%20Traffic%20Behavior.md
      # A restls script controls the behaviour after the handshake, hiding traits such as "tls in tls"
      # Details: https://github.com/3andne/restls/blob/main/Restls-Script:%20%E9%9A%90%E8%97%8F%E4%BD%A0%E7%9A%84%E4%BB%A3%E7%90%86%E8%A1%8C%E4%B8%BA.md
      restls-script: "300?100<1,400~100,350~100,600~100,300~200,300~100"

  - name: "ss-restls-tls12"
    type: ss
    server: [YOUR_SERVER_IP]
    port: 443
    cipher: chacha20-ietf-poly1305
    password: [YOUR_SS_PASSWORD]
    client-fingerprint:
      chrome # One of: chrome, ios, firefox or safari
      # One of chrome, ios, firefox, safari
    plugin: restls
    plugin-opts:
      host:
        "vscode.dev" # Must be a TLS 1.2 server
        # Must be a TLS 1.2 server
      password: [YOUR_RESTLS_PASSWORD]
      version-hint: "tls12"
      restls-script: "1000?100<1,500~100,350~100,600~100,400~200"

  # vmess
  # Supported ciphers: auto/aes-128-gcm/chacha20-poly1305/none
  - name: "vmess"
    type: vmess
    server: server
    port: 443
    uuid: uuid
    alterId: 32
    cipher: auto
    # udp: true
    # tls: true
    # fingerprint: xxxx
    # client-fingerprint: chrome    # Available: "chrome","firefox","safari","ios","random", currently only support TLS transport in TCP/GRPC/WS/HTTP for VLESS/Vmess and trojan.
    # skip-cert-verify: true
    # servername: example.com # priority over wss host
    # network: ws
    # ws-opts:
      # path: /path
      # headers:
      #   Host: v2ray.com
      # max-early-data: 2048
      # early-data-header-name: Sec-WebSocket-Protocol
      # v2ray-http-upgrade: false
      # v2ray-http-upgrade-fast-open: false

  - name: "vmess-h2"
    type: vmess
    server: server
    port: 443
    uuid: uuid
    alterId: 32
    cipher: auto
    network: h2
    tls: true
    # fingerprint: xxxx
    h2-opts:
      host:
        - http.example.com
        - http-alt.example.com
      path: /

  - name: "vmess-http"
    type: vmess
    server: server
    port: 443
    uuid: uuid
    alterId: 32
    cipher: auto
    # udp: true
    # network: http
    # http-opts:
    #   method: "GET"
    #   path:
    #     - '/'
    #     - '/video'
    #   headers:
    #     Connection:
    #       - keep-alive
    # ip-version: ipv4 # Preferred IP type: ipv4, ipv6, dual. Default dual

  - name: vmess-grpc
    server: server
    port: 443
    type: vmess
    uuid: uuid
    alterId: 32
    cipher: auto
    network: grpc
    tls: true
    # fingerprint: xxxx
    servername: example.com
    # skip-cert-verify: true
    grpc-opts:
      grpc-service-name: "example"
    # ip-version: ipv4

  # vless
  - name: "vless-tcp"
    type: vless
    server: server
    port: 443
    uuid: uuid
    network: tcp
    servername: example.com # AKA SNI
    # flow: xtls-rprx-direct # xtls-rprx-origin  # enable XTLS
    # skip-cert-verify: true
    # fingerprint: xxxx
    # client-fingerprint: random # Available: "chrome","firefox","safari","random","none"

  - name: "vless-vision"
    type: vless
    server: server
    port: 443
    uuid: uuid
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    client-fingerprint: chrome
    # fingerprint: xxxx
    # skip-cert-verify: true

  - name: "vless-reality-vision"
    type: vless
    server: server
    port: 443
    uuid: uuid
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.microsoft.com # REALITY servername
    reality-opts:
      public-key: xxx
      short-id: xxx # optional
    client-fingerprint: chrome # cannot be empty

  - name: "vless-reality-grpc"
    type: vless
    server: server
    port: 443
    uuid: uuid
    network: grpc
    tls: true
    udp: true
    flow:
    # skip-cert-verify: true
    client-fingerprint: chrome
    servername: testingcf.jsdelivr.net
    grpc-opts:
      grpc-service-name: "grpc"
    reality-opts:
      public-key: CrrQSjAG_YkHLwvM2M-7XkKJilgL5upBKCp0od0tLhE
      short-id: 10f897e26c4b9478

  - name: "vless-ws"
    type: vless
    server: server
    port: 443
    uuid: uuid
    udp: true
    tls: true
    network: ws
    # client-fingerprint: random # Available: "chrome","firefox","safari","random","none"
    servername: example.com # priority over wss host
    # skip-cert-verify: true
    # fingerprint: xxxx
    ws-opts:
      path: "/"
      headers:
        Host: example.com
      # v2ray-http-upgrade: false
      # v2ray-http-upgrade-fast-open: false

  # Trojan
  - name: "trojan"
    type: trojan
    server: server
    port: 443
    password: yourpsk
    # client-fingerprint: random # Available: "chrome","firefox","safari","random","none"
    # fingerprint: xxxx
    # udp: true
    # sni: example.com # aka server name
    # alpn:
    #   - h2
    #   - http/1.1
    # skip-cert-verify: true
    # ss-opts: # like trojan-go's `shadowsocks` config
    #   enabled: false
    #   method: aes-128-gcm # aes-128-gcm/aes-256-gcm/chacha20-ietf-poly1305
    #   password: "example"

  - name: trojan-grpc
    server: server
    port: 443
    type: trojan
    password: "example"
    network: grpc
    sni: example.com
    # skip-cert-verify: true
    # fingerprint: xxxx
    udp: true
    grpc-opts:
      grpc-service-name: "example"

  - name: trojan-ws
    server: server
    port: 443
    type: trojan
    password: "example"
    network: ws
    sni: example.com
    # skip-cert-verify: true
    # fingerprint: xxxx
    udp: true
    # ws-opts:
    #   path: /path
    #   headers:
    #     Host: example.com
    #   v2ray-http-upgrade: false
    #   v2ray-http-upgrade-fast-open: false

  - name: "trojan-xtls"
    type: trojan
    server: server
    port: 443
    password: yourpsk
    flow: "xtls-rprx-direct" # xtls-rprx-origin xtls-rprx-direct
    flow-show: true
    # udp: true
    # sni: example.com # aka server name
    # skip-cert-verify: true
    # fingerprint: xxxx

  #hysteria
  - name: "hysteria"
    type: hysteria
    server: server.com
    port: 443
    # ports: 1000,2000-3000,5000 # port cannot be omitted
    auth-str: yourpassword
    # obfs: obfs_str
    # alpn:
    #   - h3
    protocol: udp # udp / wechat-video / faketcp
    up: "30 Mbps" # Mbps when no unit is given
    down: "200 Mbps" # Mbps when no unit is given
    # sni: server.com
    # skip-cert-verify: false
    # recv-window-conn: 12582912
    # recv-window: 52428800
    # ca: "./my.ca"
    # ca-str: "xyz"
    # disable-mtu-discovery: false
    # fingerprint: xxxx
    # fast-open: true # TCP Fast Open, default false

  #hysteria2
  - name: "hysteria2"
    type: hysteria2
    server: server.com
    port: 443
    # ports: 1000,2000-3000,5000 # port cannot be omitted
    # hop-interval: 15
    #  With neither up nor down set (or both 0), BBR congestion control is used
    # up: "30 Mbps" # Mbps when no unit is given
    # down: "200 Mbps" # Mbps when no unit is given
    password: yourpassword
    # obfs: salamander # Empty by default; setting it enables obfs, only salamander is supported
    # obfs-password: yourpassword
    # sni: server.com
    # skip-cert-verify: false
    # fingerprint: xxxx
    # alpn:
    #   - h3
    # ca: "./my.ca"
    # ca-str: "xyz"
    ### quic-go settings: do not change them unless you know what you are doing ###
    # initial-stream-receive-window: 8388608
    # max-stream-receive-window: 8388608
    # initial-connection-receive-window: 20971520
    # max-connection-receive-window: 20971520

  # wireguard
  - name: "wg"
    type: wireguard
    server: 162.159.192.1
    port: 2480
    ip: 172.16.0.2
    ipv6: fd01:5ca1:ab1e:80fa:ab85:6eea:213f:f4a5
    public-key: Cr8hWlKvtDt7nrvf+f0brNQQzabAqrjfBvas9pmowjo=
    #    pre-shared-key: 31aIhAPwktDGpH4JDhA8GNvjFXEf/a6+UaQRyOAiyfM=
    private-key: eCtXsJZ27+4PbhDkHnB923tkUn2Gj59wZw5wFA75MnU=
    udp: true
    reserved: "U4An"
    # An array is also valid
    # reserved: [209,98,59]
    # Tag of an outbound proxy; when set, connections go out through that proxy
    # dialer-proxy: "ss1"
    # remote-dns-resolve: true # Force remote DNS resolution, default false
    # dns: [ 1.1.1.1, 8.8.8.8 ] # Only used when remote-dns-resolve is true
    # refresh-server-ip-interval: 60 # Interval in seconds to re-resolve the server IP; default 0 resolves only on the first connection. Enable only when the server IP changes (e.g. home DDNS)
    # If peers is not empty, allowed-ips in it cannot be empty; server, port, public-key, pre-shared-key above are ignored, but private-key is kept and can only be set at the top level
    # peers:
    #   - server: 162.159.192.1
    #     port: 2480
    #     public-key: Cr8hWlKvtDt7nrvf+f0brNQQzabAqrjfBvas9pmowjo=
    #     # pre-shared-key: 31aIhAPwktDGpH4JDhA8GNvjFXEf/a6+UaQRyOAiyfM=
    #     allowed-ips: ['0.0.0.0/0']
    #     reserved: [209,98,59]
    # When present, AmneziaWG is enabled
    # amnezia-wg-option:
    #   jc: 5
    #   jmin: 500
    #   jmax: 501
    #   s1: 30
    #   s2: 40
    #   h1: 123456
    #   h2: 67543
    #   h4: 32345
    #   h3: 123123

  # tuic
  - name: tuic
    server: www.example.com
    port: 10443
    type: tuic
    # tuicV4 needs token (do not set uuid and password together with it)
    token: TOKEN
    # tuicV5 needs uuid and password (do not set token together with them)
    uuid: 00000000-0000-0000-0000-000000000001
    password: PASSWORD_1
    # ip: 127.0.0.1 # for overwriting the DNS lookup result of the server address set in option 'server'
    # heartbeat-interval: 10000
    # alpn: [h3]
    disable-sni: true
    reduce-rtt: true
    request-timeout: 8000
    udp-relay-mode: native # Available: "native", "quic". Default: "native"
    # congestion-controller: bbr # Available: "cubic", "new_reno", "bbr". Default: "cubic"
    # cwnd: 10 # default: 32
    # max-udp-relay-packet-size: 1500
    # fast-open: true
    # skip-cert-verify: true
    # max-open-streams: 20 # default 100, too many open streams may hurt performance
    # sni: example.com
    #
    # meta and sing-box extension: use ss-uot for UDP relay; with this on, udp-relay-mode has no effect
    # Warning: not compatible with the original tuic!!!
    # udp-over-stream: false
    # udp-over-stream-version: 1

  # ShadowsocksR
  # The supported ciphers (encryption methods): all stream ciphers in ss
  # The supported obfses:
  #   plain http_simple http_post
  #   random_head tls1.2_ticket_auth tls1.2_ticket_fastauth
  # The supported protocols:
  #   origin auth_sha1_v4 auth_aes128_md5
  #   auth_aes128_sha1 auth_chain_a auth_chain_b
  - name: "ssr"
    type: ssr
    server: server
    port: 443
    cipher: chacha20-ietf
    password: "password"
    obfs: tls1.2_ticket_auth
    protocol: auth_sha1_v4
    # obfs-param: domain.tld
    # protocol-param: "#"
    # udp: true

  - name: "ssh-out"
    type: ssh

    server: 127.0.0.1
    port: 22
    username: root
    password: password
    privateKey: path

  # mieru
  - name: mieru
    type: mieru
    server: 1.2.3.4
    port: 2999
    # port-range: 2090-2099 # (do not set port and port-range together)
    transport: TCP # TCP only
    username: user
    password: password
    # Values: MULTIPLEXING_OFF, MULTIPLEXING_LOW, MULTIPLEXING_MIDDLE, MULTIPLEXING_HIGH. MULTIPLEXING_OFF turns multiplexing off. Default MULTIPLEXING_LOW.
    # multiplexing: MULTIPLEXING_LOW

# The dns outbound hijacks requests to the internal DNS module; all requests are handled internally
  - name: "dns-out"
    type: dns
proxy-groups:
  # Proxy chain; only vmess/vless/trojan/ss/ssr/tuic support UDP in a relay for now
  # wireguard is not supported in a relay, use the dialer-proxy option of a proxy instead
  # Traffic: mihomo <-> http <-> vmess <-> ss1 <-> ss2 <-> Internet
  - name: "relay"
    type: relay
    proxies:
      - http
      - vmess
      - ss1
      - ss2

  # url-test uses the proxy with the lowest latency in the URL test
  - name: "auto"
    type: url-test
    proxies:
      - ss1
      - ss2
      - vmess1
    # tolerance: 150
    # lazy: true
    # expected-status: 204 # A proxy is unavailable when the health check returns another status code
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300

  # fallback picks proxies in order by the URL test results
  - name: "fallback-auto"
    type: fallback
    proxies:
      - ss1
      - ss2
      - vmess1
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300

  # load-balance picks proxies by an algorithm
  - name: "load-balance"
    type: load-balance
    proxies:
      - ss1
      - ss2
      - vmess1
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
  # strategy: consistent-hashing # Also round-robin and sticky-sessions

  # select: the user chooses the proxy
  - name: Proxy
    type: select
    # disable-udp: true
    proxies:
      - ss1
      - ss2
      - vmess1
      - auto

  # DIRECT with a specific interface-name and fwmark
  - name: en1
    type: select
    interface-name: en1
    routing-mark: 6667
    proxies:
      - DIRECT

  - name: UseProvider
    type: select
    filter: "HK|TW" # Regular expression: proxies in provider1 whose names contain HK or TW
    use:
      - provider1
    proxies:
      - Proxy
      - DIRECT

# Proxies in Mihomo format or *ray share links
proxy-providers:
  provider1:
    type: http # path may be empty for http; the default is the proxies folder in the home dir, named by the md5 of the url
    url: "url"
    interval: 3600
    path: ./provider1.yaml # Only the mihomo home dir is allowed by default; set the env variable SKIP_SAFE_PATH_CHECK=1 to store anywhere
    proxy: DIRECT
    # size-limit: 10240 # Limit the download to 10 KB; default 0 means no limit
    header:
      User-Agent:
      - "Clash/v1.18.0"
      - "mihomo/1.18.3"
      # Accept:
      # - 'application/vnd.github.v3.raw'
      # Authorization:
      # - 'token 1231231'
    health-check:
      enable: true
      interval: 600
      # lazy: true
      url: https://cp.cloudflare.com/generate_204
      # expected-status: 204 # A proxy is unavailable when the health check returns another status code
    override: # Override some proxy settings when they are loaded
      skip-cert-verify: true
      udp: true
      # down: "50 Mbps"
      # up: "10 Mbps"
      # dialer-proxy: proxy
      # interface-name: tailscale0
      # routing-mark: 233
      # ip-version: ipv4-prefer
      # additional-prefix: "[provider1]"
      # additional-suffix: "test"
      # # Rename proxies, regular expressions supported
      # proxy-name:
      #   - pattern: "test"
      #     target: "TEST"
      #   - pattern: "IPLC-(.*?)x"
      #     target: "iplc x $1"

  provider2:
    type: inline
    dialer-proxy: proxy
    payload:
      - name: "ss1"
        type: ss
        server: server
        port: 443
        cipher: chacha20-ietf-poly1305
        password: "password"

  test:
    type: file
    path: /test.yaml
    health-check:
      enable: true
      interval: 36000
      url: https://cp.cloudflare.com/generate_204
rule-providers:
  rule1:
    behavior: classical # domain ipcidr
    interval: 259200
    path: /path/to/save/file.yaml # Only the mihomo home dir is allowed by default; set the env variable SKIP_SAFE_PATH_CHECK=1 to store anywhere
    type: http # path may be empty for http; the default is the rules folder in the home dir, named by the md5 of the url
    url: "url"
    proxy: DIRECT
    # size-limit: 10240 # Limit the download to 10 KB; default 0 means no limit
  rule2:
    behavior: classical
    interval: 259200
    path: /path/to/save/file.yaml
    type: file
  rule3:
    # mrs rule sets support only domain and ipcidr for now (not classical),
    #
    # For behavior=domain:
    #  - format=yaml converts to mrs with "mihomo convert-ruleset domain yaml XXX.yaml XXX.mrs"
    #  - format=text converts to mrs with "mihomo convert-ruleset domain text XXX.text XXX.mrs"
    #  - XXX.mrs converts back to text with "mihomo convert-ruleset domain mrs XXX.mrs XXX.text" (not back to yaml yet)
    #
    # For behavior=ipcidr:
    #  - format=yaml converts to mrs with "mihomo convert-ruleset ipcidr yaml XXX.yaml XXX.mrs"
    #  - format=text converts to mrs with "mihomo convert-ruleset ipcidr text XXX.text XXX.mrs"
    #  - XXX.mrs converts back to text with "mihomo convert-ruleset ipcidr mrs XXX.mrs XXX.text" (not back to yaml yet)
    #
    type: http
    url: "url"
    format: mrs
    behavior: domain
    path: /path/to/save/file.mrs
  rule4:
    type: inline
    behavior: domain # classical / ipcidr
    payload:
      - '.blogger.com'
      - '*.*.microsoft.com'
      - 'books.itunes.apple.com'

rules:
  - RULE-SET,rule1,REJECT
  - IP-ASN,1,PROXY
  - DOMAIN-REGEX,^abc,DIRECT
  - DOMAIN-SUFFIX,baidu.com,DIRECT
  - DOMAIN-KEYWORD,google,ss1
  - IP-CIDR,1.1.1.1/32,ss1
  - IP-CIDR6,2409::/64,DIRECT
  # TCP or UDP traffic uses the rule set named sub-rule-name1
  - SUB-RULE,(OR,((NETWORK,TCP),(NETWORK,UDP))),sub-rule-name1
  - SUB-RULE,(AND,((NETWORK,UDP))),sub-rule-name2
# Several sub-rule sets; rules branch into them, used with SUB-RULE
#                                               google.com(not match)--> baidu.com(match)
#                                                /                                |
#                                               /                                 |
#  https://baidu.com  --> rule1 --> rule2 --> sub-rule-name1(match tcp)          use DIRECT
#
#
#                                              google.com(not match)--> baidu.com(not match)
#                                                /                            |
#                                               /                             |
#  dns 1.1.1.1  --> rule1 --> rule2 --> sub-rule-name1(match udp)         sub-rule-name2(match udp)
#                                                                             |
#                                                                             |
#                                                                 use REJECT <-- 1.1.1.1/32(match)
#

sub-rules:
  sub-rule-name1:
    - DOMAIN,google.com,ss1
    - DOMAIN,baidu.com,DIRECT
  sub-rule-name2:
    - IP-CIDR,1.1.1.1/32,REJECT
    - IP-CIDR,8.8.8.8/32,ss1
    - DOMAIN,dns.alidns.com,REJECT

# Inbounds
listeners:
  - name: socks5-in-1
    type: socks
    port: 10808
    #listen: 0.0.0.0 # Listens on 0.0.0.0 by default
    # rule: sub-rule-name1 # Uses rules by default; if the sub-rule is not found, rules are used
    # proxy: proxy # When set, traffic of this inbound goes straight to that proxy
    # udp: false # Default true
    # users: # Without users the global authentication applies; with users the global setting is ignored. To skip auth for this inbound, set users: []
    #   - username: aaa
    #     password: aaa

  - name: http-in-1
    type: http
    port: 10809
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Uses rules by default; if the sub-rule is not found, rules are used
    # proxy: proxy # When set, traffic of this inbound goes straight to that proxy (the name must be valid, otherwise it fails)
    # users: # Without users the global authentication applies; with users the global setting is ignored. To skip auth for this inbound, set users: []
    #   - username: aaa
    #     password: aaa

  - name: mixed-in-1
    type: mixed # Mixed HTTP(S) and SOCKS proxy
    port: 10810
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Uses rules by default; if the sub-rule is not found, rules are used
    # proxy: proxy # When set, traffic of this inbound goes straight to that proxy (the name must be valid, otherwise it fails)
    # udp: false # Default true
    # users: # Without users the global authentication applies; with users the global setting is ignored. To skip auth for this inbound, set users: []
    #   - username: aaa
    #     password: aaa

  - name: reidr-in-1
    type: redir
    port: 10811
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Uses rules by default; if the sub-rule is not found, rules are used
    # proxy: proxy # When set, traffic of this inbound goes straight to that proxy (the name must be valid, otherwise it fails)

  - name: tproxy-in-1
    type: tproxy
    port: 10812
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Uses rules by default; if the sub-rule is not found, rules are used
    # proxy: proxy # When set, traffic of this inbound goes straight to that proxy (the name must be valid, otherwise it fails)
    # udp: false # Default true

  - name: shadowsocks-in-1
    type: shadowsocks
    port: 10813
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Uses rules by default; if the sub-rule is not found, rules are used
    # proxy: proxy # When set, traffic of this inbound goes straight to that proxy (the name must be valid, otherwise it fails)
    password: vlmpIPSyHH6f4S8WVPdRIHIlzmB+GIRfoH3aNJ/t9Gg=
    cipher: 2022-blake3-aes-256-gcm

  - name: vmess-in-1
    type: vmess
    port: 10814
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Uses rules by default; if the sub-rule is not found, rules are used
    # proxy: proxy # When set, traffic of this inbound goes straight to that proxy (the name must be valid, otherwise it fails)
    users:
      - username: 1
        uuid: 9d0cb9d0-964f-4ef6-897d-6c6b3ccf9e68
        alterId: 1
    # ws-path: "/" # When set, enables the websocket transport
    # The two options below enable tls (set both)
    # certificate: ./server.crt
    # private-key: ./server.key
    # reality-config enables reality (do not set it together with certificate and private-key)
    # reality-config:
    #   dest: test.com:443
    #   private-key: jNXHt1yRo0vDuchQlIP6Z0ZvjT3KtzVI-T4E7RoLJS0 # Can be generated with: mihomo generate reality-keypair
    #   short-id:
    #     - 0123456789abcdef
    #   server-names:
    #     - test.com

  - name: tuic-in-1
    type: tuic
    port: 10815
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Uses rules by default; if the sub-rule is not found, rules are used
    # proxy: proxy # When set, traffic of this inbound goes straight to that proxy (the name must be valid, otherwise it fails)
    # token:    # for tuicV4 (users can be set too)
    #   - TOKEN
    # users:    # for tuicV5 (token can be set too)
    #   00000000-0000-0000-0000-000000000000: PASSWORD_0
    #   00000000-0000-0000-0000-000000000001: PASSWORD_1
    #  certificate: ./server.crt
    #  private-key: ./server.key
    #  congestion-controller: bbr
    #  max-idle-time: 15000
    #  authentication-timeout: 1000
    #  alpn:
    #    - h3
    #  max-udp-relay-packet-size: 1500

  - name: tunnel-in-1
    type: tunnel
    port: 10816
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Uses rules by default; if the sub-rule is not found, rules are used
    # proxy: proxy # When set, traffic of this inbound goes straight to that proxy (the name must be valid, otherwise it fails)
    network: [tcp, udp]
    target: target.com

  - name: vless-in-1
    type: vless
    port: 10817
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Uses rules by default; if the sub-rule is not found, rules are used
    # proxy: proxy # When set, traffic of this inbound goes straight to that proxy (the name must be valid, otherwise it fails)
    users:
      - username: 1
        uuid: 9d0cb9d0-964f-4ef6-897d-6c6b3ccf9e68
        flow: xtls-rprx-vision
    # ws-path: "/" # When set, enables the websocket transport
    # The two options below enable tls (set both)
    # certificate: ./server.crt
    # private-key: ./server.key
    # reality-config enables reality (do not set it together with certificate and private-key)
    reality-config:
      dest: test.com:443
      private-key: jNXHt1yRo0vDuchQlIP6Z0ZvjT3KtzVI-T4E7RoLJS0 # Can be generated with: mihomo generate reality-keypair
      short-id:
        - 0123456789abcdef
      server-names:
        - test.com
    ### Note: a vless listener needs either "certificate and private-key" or "reality-config" ###

  - name: tun-in-1
    type: tun
    # rule: sub-rule-name1 # Uses rules by default; if the sub-rule is not found, rules are used
    # proxy: proxy # When set, traffic of this inbound goes straight to that proxy (the name must be valid, otherwise it fails)
    stack: system # gvisor / mixed
    dns-hijack:
    - 0.0.0.0:53 # DNS to hijack
    # auto-detect-interface: false # Detect the outbound interface automatically
    # auto-route: false # Set up routing tables
    # mtu: 9000 # Maximum transmission unit
    inet4-address: # The IPv4 range must be set manually
    - 198.19.0.1/30
    inet6-address: # The IPv6 range must be set manually
    - "fdfe:dcba:9877::1/126"
    # strict-route: true # Route all connections into tun to prevent leaks, but the device cannot be reached by other devices
    # inet4-route-address: # Custom routes instead of the default route when auto-route is on
    # - 0.0.0.0/1
    # - 128.0.0.0/1
    # inet6-route-address: # Custom routes instead of the default route when auto-route is on
    # - "::/1"
    # - "8000::/1"
    # endpoint-independent-nat: false # Endpoint-independent NAT
    # include-uid: # UID rules are Linux only and need auto-route
    # - 0
    # include-uid-range: # Only route these user ranges
    # - 1000:99999
    # exclude-uid: # Do not route these users
    # - 1000
    # exclude-uid-range: # Do not route these user ranges
    # - 1000:99999

    # Android user and app rules work on Android only
    # and need auto-route

    # include-android-user: # Only route these Android users
    # - 0
    # - 10
    # include-package: # Only route these Android package names
    # - com.android.chrome
    # exclude-package: # Do not route these Android package names
    # - com.android.captiveportallogin
# Inbound settings, equivalent to listeners; incoming traffic is matched by mode like the socks, mixed inbounds
# shadowsocks, vmess inbounds (incoming traffic is matched by mode like the socks, mixed inbounds)
# ss-config: ss://2022-blake3-aes-256-gcm:vlmpIPSyHH6f4S8WVPdRIHIlzmB+GIRfoH3aNJ/t9Gg=@:23456
# vmess-config: vmess://1:9d0cb9d0-964f-4ef6-897d-6c6b3ccf9e68@:12345

